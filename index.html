<script>
// ==================== Web Audio API Sound Synthesizer ====================
class SoundManager {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }

  // Safe init: creates the context and resumes it (Chrome starts it suspended)
  init() {
    try {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return false;
        this.ctx = new AudioCtx();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  playPop() {
    if (this.muted || !this.init()) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.1);
  }

  playSlap() {
    if (this.muted || !this.init()) return;
    const bufferSize = Math.floor(this.ctx.sampleRate * 0.15);
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1200;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start();
  }

  playSuccess() {
    if (this.muted || !this.init()) return;
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
    notes.forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const startTime = this.ctx.currentTime + (i * 0.08);
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.linearRampToValueAtTime(0.2, startTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.3);
    });
  }

  playTicking() {
    if (this.muted || !this.init()) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
    gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.05);
  }
}

function toggleAudio() {

const fxCtx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {

class Particle {
  constructor(x, y, isConfetti = true) {
    this.x = x;
    this.y = y;
    this.isConfetti = isConfetti;
    this.size = isConfetti ? Math.random() * 8 + 4 : Math.random() * 4 + 2;
    this.vx = (Math.random() - 0.5) * 12;
    this.vy = (Math.random() - 0.7) * 14;
    this.gravity = isConfetti ? 0.25 : 0.05;
    this.friction = 0.98;
    this.rotation = Math.random() * 360;
    this.rotSpeed = (Math.random() - 0.5) * 10;
    const colors = ['#FF2E93', '#FF8A00', '#F59E0B', '#10B981', '#06B6D4', '#8B5CF6', '#EC4899'];
    this.color = colors[Math.floor(Math.random() * colors.length)];
    this.opacity = 1;
    this.fade = Math.random() * 0.015 + 0.005;
  }

  update() {
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.rotation += this.rotSpeed;
    this.opacity -= this.fade;
  }

  draw() {
    fxCtx.save();
    fxCtx.translate(this.x, this.y);
    fxCtx.rotate((this.rotation * Math.PI) / 180);
    fxCtx.globalAlpha = Math.max(0, this.opacity);
    fxCtx.fillStyle = this.color;
    if (this.isConfetti) {
      fxCtx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 1.5);
    } else {
      fxCtx.beginPath();
      fxCtx.arc(0, 0, this.size, 0, Math.PI * 2);
      fxCtx.fill();
    }
    fxCtx.restore();
  }
}

function triggerConfetti(x = window.innerWidth / 2, y = window.innerHeight / 3, count = 80) {
  sounds.playSuccess();
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, true));
  }
}

function renderCanvas() {
  fxCtx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].opacity <= 0) {
      particles.splice(i, 1);
    }
  }
  requestAnimationFrame(renderCanvas);
}

function openModal(modal) {
  modal.classList.add('is-open');
  // double rAF so the transition runs after display is applied
  requestAnimationFrame(() => {
    requestAnimationFrame(() => modal.classList.add('is-visible'));
  });
}

function closeModal(modal, after) {
  modal.classList.remove('is-visible');
  setTimeout(() => {
    modal.classList.remove('is-open');
    if (after) after();
  }, 300);
}

function showSlapModal() {

      <div class="flex items-center justify-between mb-6 border-b border-white/10 pb-4">
        <span class="text-xs font-bold uppercase tracking-widest px-3 py-1 bg-pink-500/20 text-pink-300 rounded-full border border-pink-500/30">
          <i class="fas fa-lock mr-1"></i> Security Check
        </span>
        <span class="text-xs text-purple-200">Birthday Vault</span>
      </div>

      <div class="text-center space-y-4">
        <div class="text-6xl animate-bounce-soft">🔐</div>
        <h2 class="text-2xl font-bold font-outfit text-white">Secret Birthday Unlock</h2>
        <p id="pin-prompt" class="text-purple-200 text-base leading-relaxed">
          Enter <strong class="text-yellow-300 font-extrabold">J....R</strong>’s birthday date to open your surprise 🎂
        </p>

        <div class="py-2">
          <input id="pin-input" type="tel" inputmode="numeric" maxlength="10" placeholder="DDMMYYYY"
            class="w-full text-center text-2xl font-mono tracking-widest py-3 px-4 rounded-2xl bg-black/50 border-2 border-purple-400/50 text-yellow-300 focus:outline-none focus:border-pink-500 transition-all placeholder:text-gray-600">
        </div>

        <p id="pin-err" class="text-red-400 font-semibold text-sm min-h-[20px]"></p>

        <button id="pin-submit" class="w-full btn-gradient py-4 rounded-2xl font-black text-lg text-white shadow-xl tracking-wide uppercase">
          Unlock Birthday Vault 🔓
        </button>
      </div>
    </div>
  `;

  const input = document.getElementById('pin-input');
  const err = document.getElementById('pin-err');
  const card = document.getElementById('lock-card');
  const prompt = document.getElementById('pin-prompt');

  let lockStep = 1;
  const errorMsgs = [
    "Wrong PIN! 🤨 Even you forgot your birthday?",
    "Nope! 😂 Hint: it’s the day you were born!",
    "Still wrong, Arbhandi! 🙈 Format: 15111999… oops 🤫"
  ];
  let errIdx = 0;

  function showError(msg) {
    err.textContent = msg;
    card.classList.remove('shake-anim');
    void card.offsetWidth; // trigger reflow
    card.classList.add('shake-anim');
  }

  const handleUnlock = () => {
    sounds.playPop();
    const val = input.value.replace(/\D/g, '');

    if (lockStep === 1) {
      if (val.length < 4) {
        showError('Enter a valid date first 😜');
        return;
      }
      showPopupMsg(
        'O hli hoi birthday TRI ty date enter odhi krdi pai! 🤦‍♀️<br><br>Arbhandi jai apni Mr k likh yaad ha ty nity <b>J....R</b> TU poch ly 😜',
        () => {
          lockStep = 2;
          input.value = '';
          err.textContent = '';
          prompt.innerHTML = 'Now enter <strong class="text-yellow-300 font-extrabold">your July</strong> birthday date 🗓️';
          input.focus();
        }
      );
      return;
    }

    if (lockStep === 2) {
      if (val.length < 4) {
        showError('Enter a valid date first 😜');
        return;
      }
      showPopupMsg(
        'Tuun ty waqia e hli hoi aaj 02 July ha? 🙈<br><br>Tnu oh bri yaad amdi aaj di likh chabal ballan 😜',
        () => {
          lockStep = 3;
          input.value = '';
          err.textContent = '';
          prompt.innerHTML = 'Now enter <strong class="text-yellow-300 font-extrabold">your actual</strong> birthday date 🎂 (15111999) to unlock 🔓';
          input.focus();
        }
      );
      return;
    }

    if (val === '15111999') {
      triggerConfetti(window.innerWidth / 2, window.innerHeight / 2, 120);
      renderStep(0);
    } else {
      showError(errorMsgs[errIdx++ % errorMsgs.length]);
    }
  };

  document.getElementById('pin-submit').onclick = handleUnlock;
  input.onkeydown = (e) => { if (e.key === 'Enter') handleUnlock(); };
}

// ==================== Interactive Step Engine ====================
function renderStep(idx) {
  // stop any running cake timer when leaving a step
  if (cakeTimer) { clearInterval(cakeTimer); cakeTimer = null; }

  const stepData = STEPS[idx];

  if (stepData.final) {
    appWrapper.innerHTML = `
      <div class="glass-card rounded-3xl p-6 md:p-8 max-w-2xl mx-auto border border-pink-500/30 shadow-2xl space-y-6 relative overflow-hidden">
        <div class="text-center space-y-2">
          <div class="text-6xl animate-bounce mb-2">🎂🥳🎊</div>
          <span class="px-4 py-1.5 rounded-full bg-pink-500/20 text-pink-300 text-xs font-black uppercase tracking-widest border border-pink-500/40">
            Grand Finale
          </span>
          <h2 class="text-3xl md:text-4xl font-extrabold font-outfit text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-yellow-300 to-emerald-300">
            Happy 27th Birthday, Uzma! 💐
          </h2>
        </div>

        <div id="wishes-list" class="space-y-4 py-2">
          ${WISHES.map((w, i) => `
            <div class="wish-item opacity-0 transform translate-y-6 transition-all duration-700 glass-card p-4 rounded-2xl border-l-4 ${i % 2 === 0 ? 'border-pink-500 bg-white/5' : 'border-purple-500 bg-white/10'} text-purple-100 text-base md:text-lg leading-relaxed shadow-md">
              ${w}
            </div>
          `).join('')}
        </div>

        <div class="text-center pt-6 border-t border-white/10">
          <p class="text-2xl md:text-3xl font-extrabold font-outfit text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-300 to-yellow-400 animate-pulse">
            With lots of love 💕
          </p>
          <p class="text-lg font-bold text-pink-200 mt-1">Your Arbhanda Bhai J....r 🤪👑</p>

          <button id="more-confetti" class="mt-6 px-6 py-3 rounded-2xl bg-gradient-to-r from-pink-500 to-amber-500 text-white font-bold text-sm shadow-xl hover:scale-105 active:scale-95 transition-all">
            Celebrate More Confetti! 🎉✨
          </button>
        </div>
      </div>
    `;

    document.getElementById('more-confetti').onclick = () => {
      triggerConfetti(window.innerWidth / 2, window.innerHeight / 2, 150);
    };

    triggerConfetti(window.innerWidth / 2, window.innerHeight / 3, 100);

    // Staggered reveal for wishes
    const items = document.querySelectorAll('.wish-item');
    items.forEach((el, i) => {
      setTimeout(() => {
        sounds.playPop();
        el.classList.remove('opacity-0', 'translate-y-6');
        el.classList.add('opacity-100', 'translate-y-0');
      }, 400 + i * 500);
    });

    // Continuous soft confetti interval
    if (finalTimer) clearInterval(finalTimer);
    finalTimer = setInterval(() => {
      triggerConfetti(Math.random() * window.innerWidth, Math.random() * window.innerHeight * 0.5, 25);
    }, 4500);

    return;
  }

  // Render Standard Card Step
  appWrapper.innerHTML = `
    <div class="glass-card rounded-3xl p-6 md:p-8 max-w-xl mx-auto border border-white/20 shadow-2xl relative overflow-hidden transition-all duration-500">
      <div class="flex items-center justify-between mb-4 border-b border-white/10 pb-3">
        <span class="text-xs font-bold uppercase tracking-widest px-3 py-1 bg-gradient-to-r ${stepData.color} text-white rounded-full shadow-md">
          ${stepData.badge}
        </span>
        <h3 class="text-sm font-bold text-purple-200">${stepData.t}</h3>
      </div>

      <div class="my-4">
        ${stepData.b}
      </div>

      <div class="flex flex-col sm:flex-row gap-3 pt-4 border-t border-white/10">
        <button id="btn-yes" class="flex-1 btn-gradient py-3.5 px-6 rounded-2xl font-black text-base text-white uppercase tracking-wider shadow-lg">
          ${stepData.btn}
        </button>
        <button id="btn-no" class="sm:w-1/3 py-3.5 px-6 rounded-2xl bg-gray-800/80 hover:bg-gray-700/80 text-gray-300 font-bold text-base border border-white/10 transition-all active:scale-95">
          No 🙅
        </button>
      </div>
    </div>
  `;

  const btnYes = document.getElementById('btn-yes');
  const btnNo = document.getElementById('btn-no');

  // Cake loading progress bar
  if (stepData.load) {
    const pg = document.getElementById('pg');
    const pt = document.getElementById('pt');
    let progress = 0;
    const msgs = [
      "Mixing organic flour… 🥣",
      "Adding rainbow sprinkles… 🌈",
      "Kaki is secretly tasting it… 👅",
      "Baking at optimum temperature… 🔥",
      "Cake ready for Uzma! 🎂"
    ];

    cakeTimer = setInterval(() => {
      progress += Math.random() * 12 + 5;
      if (progress > 100) progress = 100;

      sounds.playTicking();
      pg.style.width = progress + '%';
      const msgIdx = Math.min(4, Math.floor(progress / 21));
      pt.textContent = `${Math.floor(progress)}% - ${msgs[msgIdx]}`;

      if (progress >= 100) {
        clearInterval(cakeTimer);
        cakeTimer = null;
        triggerConfetti(window.innerWidth / 2, window.innerHeight / 2, 50);
      }
    }, 250);
  }

  btnNo.onclick = showSlapModal;

  btnYes.onclick = () => {
    sounds.playPop();
    triggerConfetti(window.innerWidth / 2, window.innerHeight / 2, 40);
    renderStep(idx + 1);
  };
}

// ==================== Initialize Application ====================
document.addEventListener('DOMContentLoaded', renderLockScreen);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
